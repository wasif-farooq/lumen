[project]
name = "lumen"
version = "0.1.1"
description = "Local AI assistant for your files: find, open and ask about documents, photos and videos."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "faster-whisper>=1.2.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0",
    "langfuse>=5.0.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
lumen = "lumen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN"]
ignore = [
    "B008",  # FastAPI's Depends(...) in argument defaults is the intended pattern
    "ANN401",  # Any is allowed where a value really can be anything (tool arguments, JSON)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # tests are read as examples; their fixtures' types are clear from conftest
"scripts/*" = ["ANN"]

[tool.pyright]
include = ["lumen"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
