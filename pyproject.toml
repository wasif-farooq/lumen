[project]
name = "lumen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "faster-whisper>=1.2.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0",
    "langfuse>=5.0.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
lumen = "lumen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
