# Builds the Linux packages (.deb and AppImage) and publishes them as a GitHub Release.
#   Automatic: every push to main that passes Checks (auto-release.yml tags it and calls this)
#   By hand:   git tag v0.3.0 && git push origin v0.3.0
#   Test build without releasing: Actions → Release → Run workflow
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "The tag to release (already pushed), e.g. v0.2.1"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the test build (default: the one in pyproject.toml)"
        required: false

permissions:
  contents: write # create the release and upload its files

env:
  # The tag being released: the pushed tag, or the one auto-release.yml made. Empty for a test build.
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build .deb and AppImage (same Docker build as locally)
        env:
          LUMEN_VERSION: ${{ env.TAG || inputs.version }}
        run: |
          mkdir -p app/dist/packages
          chmod 777 app/dist/packages   # the build container runs as uid 1000
          docker compose --profile build run --rm package

      - name: Checksums
        working-directory: app/dist/packages
        run: sha256sum -- *.deb *.AppImage | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: lumen-linux-packages
          path: app/dist/packages/
          retention-days: 14

      - name: Publish release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" app/dist/packages/*.deb app/dist/packages/*.AppImage app/dist/packages/SHA256SUMS \
            --title "Lumen $TAG" \
            --generate-notes \
            --notes "Install the .deb: \`sudo apt install ./lumen_*_amd64.deb\`, then open Lumen from the app menu.
          Or run the AppImage: \`chmod +x Lumen-*.AppImage && ./Lumen-*.AppImage\`.
          Lumen uses Ollama for its models: install it from https://ollama.com and run \`ollama pull qwen3.5:2b\`.
          Built on Ubuntu 24.04; needs a distribution of that age or newer."
